<script>
// 番茄时钟配置
let timer = null;
let isRunning = false;
let remainingSeconds = 25 * 60; // 剩余秒数
let pomodoroCount = 0;
let currentMode = 'work';

// 时间设置（分钟）
let workTime = 25;
let shortBreakTime = 5;
let longBreakTime = 15;

// 模式配置
const modes = {
    work: {
        label: '专注时间'
    },
    shortBreak: {
        label: '短休息'
    },
    longBreak: {
        label: '长休息'
    }
};

// 更新时间显示
function updateTimeDisplay() {
    const minutes = Math.floor(remainingSeconds / 60);
    const seconds = remainingSeconds % 60;
    const timeText = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
    document.getElementById('timeText').textContent = timeText;
    document.title = `${timeText} - ${modes[currentMode].label}`;
}

// 更新模式
function setMode(mode) {
    currentMode = mode;
    resetTimer();

    document.querySelectorAll('.mode-btn').forEach(btn => btn.classList.remove('active'));
    event.target.classList.add('active');

    document.getElementById('timeLabel').textContent = modes[mode].label;
}

// 播放提示音
function playAlertSound() {
    const soundToggle = document.getElementById('soundToggle');
    if (!soundToggle.checked) return;

    const audioContext = new (window.AudioContext || window.webkitAudioContext)();

    const oscillator = audioContext.createOscillator();
    const gainNode = audioContext.createGain();

    oscillator.connect(gainNode);
    gainNode.connect(audioContext.destination);

    oscillator.type = 'sine';
    oscillator.frequency.setValueAtTime(880, audioContext.currentTime);
    oscillator.frequency.setValueAtTime(660, audioContext.currentTime + 0.1);
    oscillator.frequency.setValueAtTime(880, audioContext.currentTime + 0.2);

    gainNode.gain.setValueAtTime(0.3, audioContext.currentTime);
    gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.5);

    oscillator.start(audioContext.currentTime);
    oscillator.stop(audioContext.currentTime + 0.5);
}

// 切换计时器
function toggleTimer() {
    const startBtn = document.getElementById('startBtn');
    const btnText = startBtn.querySelector('.btn-text');

    if (isRunning) {
        // 暂停
        clearInterval(timer);
        isRunning = false;
        btnText.textContent = '开始';
        startBtn.classList.remove('running');
    } else {
        // 开始
        timer = setInterval(() => {
            remainingSeconds--;
            updateTimeDisplay();

            if (remainingSeconds <= 0) {
                clearInterval(timer);
                isRunning = false;

                playAlertSound();

                if (currentMode === 'work') {
                    pomodoroCount++;
                    document.getElementById('pomodoroCount').textContent = pomodoroCount;
                    addTomato();
                    showAlert('🎉 恭喜！完成了一个番茄时钟！');
                } else {
                    showAlert('☕ 休息时间结束，开始专注吧！');
                }

                btnText.textContent = '开始';
                startBtn.classList.remove('running');
                resetTimer();
            }
        }, 1000);

        isRunning = true;
        btnText.textContent = '暂停';
        startBtn.classList.add('running');
    }
}

// 重置计时器
function resetTimer() {
    clearInterval(timer);
    isRunning = false;

    const startBtn = document.getElementById('startBtn');
    const btnText = startBtn.querySelector('.btn-text');

    btnText.textContent = '开始';
    startBtn.classList.remove('running');

    // 重置时间
    switch (currentMode) {
        case 'work':
            remainingSeconds = workTime * 60;
            break;
        case 'shortBreak':
            remainingSeconds = shortBreakTime * 60;
            break;
        case 'longBreak':
            remainingSeconds = longBreakTime * 60;
            break;
    }

    updateTimeDisplay();
}

function addTomato() {
    const container = document.getElementById('tomatoContainer');
    const tomato = document.createElement('span');
    tomato.className = 'tomato';
    tomato.textContent = '🍅';
    container.appendChild(tomato);
}

function updateSettings() {
    workTime = parseInt(document.getElementById('workTime').value) || 25;
    shortBreakTime = parseInt(document.getElementById('shortBreakTime').value) || 5;
    longBreakTime = parseInt(document.getElementById('longBreakTime').value) || 15;

    if (!isRunning) {
        resetTimer();
    }
}

// 页面可见性变化时更新显示
document.addEventListener('visibilitychange', () => {
    if (isRunning && !document.hidden) {
        // 页面重新可见时，立即更新显示
        updateTimeDisplay();
    }
});

// 显示提示条
function showAlert(message) {
    const alertBar = document.getElementById('alertBar');
    const alertMessage = document.getElementById('alertMessage');
    alertMessage.textContent = message;
    alertBar.classList.remove('hidden');

    // 5秒后自动关闭
    setTimeout(hideAlert, 5000);
}

// 隐藏提示条
function hideAlert() {
    const alertBar = document.getElementById('alertBar');
    alertBar.classList.add('hidden');
}

updateTimeDisplay();
</script>

    // Copy to clipboard function
    window.copyToClipboard = function(text) {
        navigator.clipboard.writeText(text).then(function() {
            alert('已复制: ' + text);
        }).catch(function(err) {
            // Fallback for older browsers
            var textArea = document.createElement('textarea');
            textArea.value = text;
            textArea.style.position = 'fixed';
            textArea.style.left = '-999999px';
            document.body.appendChild(textArea);
            textArea.select();
            try {
                document.execCommand('copy');
                alert('已复制: ' + text);
            } catch (err) {
                alert('复制失败，请手动复制');

            document.body.removeChild(textArea);
